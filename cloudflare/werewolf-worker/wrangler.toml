name = "werewolf-room-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://irvan1609.github.io,http://localhost:5173,http://127.0.0.1:5173"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "WerewolfRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WerewolfRoom"]

[[ratelimits]]
name = "ROOM_CREATE_LIMITER"
namespace_id = "91609101"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "ROOM_JOIN_LIMITER"
namespace_id = "91609102"

[ratelimits.simple]
limit = 20
period = 60
