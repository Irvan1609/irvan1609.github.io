<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANOVA Faktorial — Statistical Tool</title><link rel="stylesheet" href="star-ui.css"></head><body><div class="star-app"><div class="titlebar"><div class="icon">★</div><strong>Statistical Tool for Agricultural Research</strong><span>— ANOVA Faktorial</span></div><div class="menubar"><div class="menu"><a href="index.html" style="color:inherit;text-decoration:none">Data</a></div><div class="menu">Design<div class="dropdown"><a href="index.html">Data Sheet</a></div></div><div class="menu">Analyze<div class="dropdown"><a href="analysis-rak.html">ANOVA RAK</a><a href="analysis-factorial.html">ANOVA Faktorial</a></div></div></div><main style="padding:18px;overflow:auto"><div class="card" style="background:#fff;border:1px solid #cfd5dc;padding:16px"><h2 style="margin-top:0">ANOVA Faktorial Dua Faktor</h2><p id="meta">Memuat desain...</p><div class="table-wrap"><table class="sheet result-table"><thead><tr><th>Sumber keragaman</th><th>db</th><th>JK</th><th>KT</th><th>F-hitung</th><th>p-value</th></tr></thead><tbody id="body"></tbody></table></div><p id="note" class="paste-tip"></p><button class="sheet-btn" onclick="location.href='index.html'">← Kembali ke Data Sheet</button></div></main></div><script>
const K='star-dataset-v2';const s=JSON.parse(localStorage.getItem(K)||'{}'),d=s.design||{};const hs=s.headers||[],rows=s.rows||[];const num=v=>{if(v==null||String(v).trim()==='')return null;const n=Number(String(v).trim().replace(',','.'));return Number.isFinite(n)?n:null};function lg(z){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.001208650973866179,-.000005395239384953];let x=z,y=x,tmp=x+5.5;tmp-=(x+.5)*Math.log(tmp);let ser=1.000000000190015;for(let j=0;j<c.length;j++){y+=1;ser+=c[j]/y}return -tmp+Math.log(2.5066282746310005*ser/x)}function bc(a,b,x){const M=200,E=3e-7,F=1e-30;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<F)d=F;d=1/d;let h=d;for(let m=1;m<=M;m++){let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<E)break}return h}function bi(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bc(a,b,x)/a:1-bt*bc(b,a,1-x)/b}function fp(F,d1,d2){if(!Number.isFinite(F)||F<0)return 1;return bi(d2/(d2+d1*F),d2/2,d1/2)}const f=x=>Number(x).toFixed(4);
function run(){if(d.type!=='FAKTORIAL'||d.factorA<0||d.factorB<0||d.response<0){document.getElementById('body').innerHTML='<tr><td colspan="6">Desain faktorial belum ditentukan. Kembali ke Data Sheet → Design → Faktorial.</td></tr>';return}const dat=rows.map(r=>({a:String(r[d.factorA]??'').trim(),b:String(r[d.factorB]??'').trim(),y:num(r[d.response])})).filter(x=>x.a&&x.b&&x.y!==null);const A=[...new Set(dat.map(x=>x.a))],B=[...new Set(dat.map(x=>x.b))],cells=A.length*B.length,N=dat.length,n=N/cells;document.getElementById('meta').textContent=`Faktor A: ${hs[d.factorA]} · Faktor B: ${hs[d.factorB]} · Respons: ${hs[d.response]} · ${A.length} × ${B.length} kombinasi · n per kombinasi = ${n}`;if(!Number.isInteger(n)||n<1){document.getElementById('body').innerHTML='<tr><td colspan="6">ERROR: Data faktorial harus seimbang; setiap kombinasi A × B harus memiliki jumlah pengamatan yang sama.</td></tr>';return}const gm=dat.reduce((a,x)=>a+x.y,0)/N,ma=A.map(a=>dat.filter(x=>x.a===a).reduce((q,x)=>q+x.y,0)/(B.length*n)),mb=B.map(b=>dat.filter(x=>x.b===b).reduce((q,x)=>q+x.y,0)/(A.length*n));const mc={};A.forEach(a=>B.forEach(b=>{const z=dat.filter(x=>x.a===a&&x.b===b);mc[a+'\u0000'+b]=z.reduce((q,x)=>q+x.y,0)/n}));const sst=dat.reduce((q,x)=>q+(x.y-gm)**2,0),ssa=B.length*n*ma.reduce((q,m)=>q+(m-gm)**2,0),ssb=A.length*n*mb.reduce((q,m)=>q+(m-gm)**2,0),ssab=n*sum(A.flatMap(a=>B.map(b=>(mc[a+'\u0000'+b]-ma[A.indexOf(a)]-mb[B.indexOf(b)]+gm)**2))),sse=sst-ssa-ssb-ssab,dfa=A.length-1,dfb=B.length-1,dfab=dfa*dfb,dfe=N-cells,msa=ssa/dfa,msb=ssb/dfb,msab=ssab/dfab,mse=sse/dfe;const sum=x=>x.reduce((a,b)=>a+b,0);const Fa=msa/mse,Fb=msb/mse,Fab=msab/mse;document.getElementById('body').innerHTML=`<tr><td>Faktor A</td><td>${dfa}</td><td>${f(ssa)}</td><td>${f(msa)}</td><td>${f(Fa)}</td><td>${f(fp(Fa,dfa,dfe))}</td></tr><tr><td>Faktor B</td><td>${dfb}</td><td>${f(ssb)}</td><td>${f(msb)}</td><td>${f(Fb)}</td><td>${f(fp(Fb,dfb,dfe))}</td></tr><tr><td>A × B</td><td>${dfab}</td><td>${f(ssab)}</td><td>${f(msab)}</td><td>${f(Fab)}</td><td>${f(fp(Fab,dfab,dfe))}</td></tr><tr><td>Galat</td><td>${dfe}</td><td>${f(sse)}</td><td>${f(mse)}</td><td>—</td><td>—</td></tr><tr><td>Total</td><td>${N-1}</td><td>${f(sst)}</td><td>—</td><td>—</td><td>—</td></tr>`;document.getElementById('note').textContent=`Model faktorial dua faktor: Yijk = μ + Ai + Bj + (AB)ij + εijk. Perhitungan menggunakan data seimbang dengan n yang sama pada setiap kombinasi.`}run();</script></body></html>
