<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANOVA RAK — Statistical Tool</title><link rel="stylesheet" href="star-ui.css"></head><body><div class="star-app"><div class="titlebar"><div class="icon">★</div><strong>Statistical Tool for Agricultural Research</strong><span>— ANOVA RAK</span></div><div class="menubar"><div class="menu"><a href="index.html" style="color:inherit;text-decoration:none">Data</a></div><div class="menu">Design<div class="dropdown"><a href="index.html">Data Sheet</a></div></div><div class="menu">Analyze<div class="dropdown"><a href="analysis-rak.html">ANOVA RAK</a><a href="analysis-factorial.html">ANOVA Faktorial</a></div></div></div><main style="padding:18px;overflow:auto"><div class="card" style="background:#fff;border:1px solid #cfd5dc;padding:16px"><h2 style="margin-top:0">Rancangan Acak Kelompok (RAK)</h2><p id="meta">Memuat desain...</p><div class="table-wrap"><table class="sheet result-table"><thead><tr><th>Sumber keragaman</th><th>db</th><th>JK</th><th>KT</th><th>F-hitung</th><th>p-value</th></tr></thead><tbody id="body"></tbody></table></div><p id="note" class="paste-tip"></p><h3>Rerata perlakuan</h3><div class="table-wrap"><table class="sheet result-table"><thead><tr><th>Perlakuan</th><th>n</th><th>Rerata</th></tr></thead><tbody id="means"></tbody></table></div><button class="sheet-btn" onclick="location.href='index.html'">← Kembali ke Data Sheet</button></div></main></div><script>
const K='star-dataset-v2';const s=JSON.parse(localStorage.getItem(K)||'{}'),d=s.design||{};const hs=s.headers||[],rows=s.rows||[];const num=v=>{if(v==null||String(v).trim()==='')return null;const n=Number(String(v).trim().replace(',','.'));return Number.isFinite(n)?n:null};
function lg(z){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.001208650973866179,-.000005395239384953];let x=z,y=x,tmp=x+5.5;tmp-=(x+.5)*Math.log(tmp);let ser=1.000000000190015;for(let j=0;j<c.length;j++){y+=1;ser+=c[j]/y}return -tmp+Math.log(2.5066282746310005*ser/x)}function bc(a,b,x){const M=200,E=3e-7,F=1e-30;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<F)d=F;d=1/d;let h=d;for(let m=1;m<=M;m++){let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<E)break}return h}function bi(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bc(a,b,x)/a:1-bt*bc(b,a,1-x)/b}function fp(F,d1,d2){if(!Number.isFinite(F)||F<0)return 1;return bi(d2/(d2+d1*F),d2/2,d1/2)}const f=x=>Number(x).toFixed(4);
function run(){if(d.type!=='RAK'||d.block<0||d.treatment<0||d.response<0){document.getElementById('body').innerHTML='<tr><td colspan="6">Desain RAK belum ditentukan. Kembali ke Data Sheet → Design → RAK.</td></tr>';return}const dat=rows.map(r=>({b:String(r[d.block]??'').trim(),t:String(r[d.treatment]??'').trim(),y:num(r[d.response])})).filter(x=>x.b&&x.t&&x.y!==null);const B=[...new Set(dat.map(x=>x.b))],T=[...new Set(dat.map(x=>x.t))],N=dat.length,k=T.length,b=B.length;document.getElementById('meta').textContent=`Blok: ${hs[d.block]} · Perlakuan: ${hs[d.treatment]} · Respons: ${hs[d.response]} · ${b} blok × ${k} perlakuan · n=${N}`;if(N!==b*k){document.getElementById('body').innerHTML='<tr><td colspan="6">ERROR: RAK standar memerlukan data seimbang. Jumlah pengamatan harus sama dengan jumlah blok × jumlah perlakuan.</td></tr>';return}const gm=dat.reduce((a,x)=>a+x.y,0)/N,bt=B.map(x=>dat.filter(q=>q.b===x).reduce((a,q)=>a+q.y,0)/k),tm=T.map(x=>dat.filter(q=>q.t===x).reduce((a,q)=>a+q.y,0)/b);const sst=dat.reduce((a,x)=>a+(x.y-gm)**2,0),ssb=k*bt.reduce((a,m)=>a+(m-gm)**2,0),sstt=b*tm.reduce((a,m)=>a+(m-gm)**2,0),sse=sst-ssb-sstt,dbb=b-1,dbt=k-1,dbe=(b-1)*(k-1),msb=ssb/dbb,mst=sstt/dbt,mse=sse/dbe,Fb=msb/mse,Ft=mst/mse;document.getElementById('body').innerHTML=`<tr><td>Blok</td><td>${dbb}</td><td>${f(ssb)}</td><td>${f(msb)}</td><td>${f(Fb)}</td><td>${f(fp(Fb,dbb,dbe))}</td></tr><tr><td>Perlakuan</td><td>${dbt}</td><td>${f(sstt)}</td><td>${f(mst)}</td><td>${f(Ft)}</td><td>${f(fp(Ft,dbt,dbe))}</td></tr><tr><td>Galat</td><td>${dbe}</td><td>${f(sse)}</td><td>${f(mse)}</td><td>—</td><td>—</td></tr><tr><td>Total</td><td>${N-1}</td><td>${f(sst)}</td><td>—</td><td>—</td><td>—</td></tr>`;document.getElementById('means').innerHTML=T.map((t,i)=>`<tr><td>${t}</td><td>${b}</td><td>${f(tm[i])}</td></tr>`).join('');document.getElementById('note').textContent=`Model RAK seimbang: Yij = μ + τi + βj + εij. Galat dihitung setelah mengeluarkan variasi blok dan perlakuan.`}run();</script></body></html>
