name: Train Hitung Cabai

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

concurrency:
  group: train-hitung-cabai
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      CHILI_API_URL: ${{ vars.CHILI_API_URL }}
      CHILI_ADMIN_TOKEN: ${{ secrets.CHILI_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Periksa konfigurasi
        id: config
        shell: bash
        run: |
          if [ -z "$CHILI_API_URL" ] || [ -z "$CHILI_ADMIN_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API belum dikonfigurasi; training dilewati."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ambil dataset tervalidasi
        if: steps.config.outputs.ready == 'true'
        id: dataset
        run: python scripts/fetch-chili-dataset.py --api-url "$CHILI_API_URL" --token "$CHILI_ADMIN_TOKEN" --out .chili-dataset --min-samples 100

      - name: Periksa apakah ada data baru
        if: steps.dataset.outputs.ready == 'true'
        id: freshness
        shell: bash
        run: |
          LAST=0
          if [ -f public/hitung-cabai/models/metrics.json ]; then
            LAST=$(python -c "import json; print(json.load(open('public/hitung-cabai/models/metrics.json')).get('sample_count', 0))")
          fi
          if [ "${{ steps.dataset.outputs.sample_count }}" -gt "$LAST" ]; then
            echo "train=true" >> "$GITHUB_OUTPUT"
          else
            echo "train=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada sampel baru; training dilewati."
          fi

      - name: Siapkan Python
        if: steps.freshness.outputs.train == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Pasang mesin training
        if: steps.freshness.outputs.train == 'true'
        run: pip install "ultralytics>=8.3,<9" onnx onnxslim

      - name: Latih dan evaluasi kandidat
        if: steps.freshness.outputs.train == 'true'
        id: train
        run: python scripts/train-chili-model.py --data .chili-dataset/data.yaml --epochs 30 --sample-count ${{ steps.dataset.outputs.sample_count }}

      - name: Simpan diagnostik kandidat
        if: steps.freshness.outputs.train == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hitung-cabai-candidate-${{ github.run_number }}
          path: |
            .chili-training/candidate-metrics.json
            .chili-training/candidate/results.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Publikasikan model yang lolos
        if: steps.train.outputs.accepted == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hitung-cabai/model-manifest.json public/hitung-cabai/models/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan model."
          else
            git commit -m "Hitung Cabai: promote validated model"
            git push
          fi
