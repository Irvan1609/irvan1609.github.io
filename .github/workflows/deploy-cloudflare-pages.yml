name: Deploy Agrotik to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "mendeley/**"
      - "print-skripsi/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "scripts/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-agrotik
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify and build public artifact
        run: npm run verify

      - name: Resolve or create Cloudflare Pages project
        id: pages-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx --yes wrangler@4 pages project list --json)"
          if printf '%s' "$LIST" | jq -e '.[] | select(.name=="agrotik")' >/dev/null 2>&1; then
            PROJECT="agrotik"
          elif printf '%s' "$LIST" | jq -e '.[] | select(.name=="agrotik-irvan1609")' >/dev/null 2>&1; then
            PROJECT="agrotik-irvan1609"
          else
            set +e
            CREATE_PRIMARY="$(npx --yes wrangler@4 pages project create agrotik --production-branch=master 2>&1)"
            PRIMARY_STATUS=$?
            set -e
            if [ "$PRIMARY_STATUS" -eq 0 ]; then
              printf '%s\n' "$CREATE_PRIMARY"
              PROJECT="agrotik"
            else
              echo "::warning::Nama Pages 'agrotik' tidak dapat dibuat; mencoba nama cadangan unik."
              printf '%s\n' "$CREATE_PRIMARY"
              npx --yes wrangler@4 pages project create agrotik-irvan1609 --production-branch=master
              PROJECT="agrotik-irvan1609"
            fi
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "url=https://$PROJECT.pages.dev" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages project: $PROJECT"

      - name: Deploy dist to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.pages-project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PROJECT" \
            --branch=master \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Agrotik production deploy"

      - name: Publish deployment summary
        env:
          PAGES_URL: ${{ steps.pages-project.outputs.url }}
        run: |
          echo "### Agrotik Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Production URL: $PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
