name: Deploy Agrotik to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "mendeley/**"
      - "print-skripsi/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "scripts/public-build.mjs"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-agrotik
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify and build public artifact
        run: npm run verify

      - name: Resolve or create Cloudflare Pages project
        id: pages-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          LIST="$(npx --yes wrangler@4 pages project list --json 2>&1)"
          LIST_STATUS=$?
          set -e
          if [ "$LIST_STATUS" -ne 0 ]; then
            echo "::warning::Cloudflare API token belum memiliki akses Pages. Tambahkan Account > Cloudflare Pages > Edit (Pages Write), lalu workflow akan mencoba lagi pada push berikutnya."
            printf '%s\n' "$LIST"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "project=" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          if printf '%s' "$LIST" | jq -e '.[] | select(.name=="agrotik")' >/dev/null 2>&1; then
            PROJECT="agrotik"
          elif printf '%s' "$LIST" | jq -e '.[] | select(.name=="agrotik-irvan1609")' >/dev/null 2>&1; then
            PROJECT="agrotik-irvan1609"
          else
            set +e
            CREATE_PRIMARY="$(npx --yes wrangler@4 pages project create agrotik --production-branch=master 2>&1)"
            PRIMARY_STATUS=$?
            set -e
            if [ "$PRIMARY_STATUS" -eq 0 ]; then
              printf '%s\n' "$CREATE_PRIMARY"
              PROJECT="agrotik"
            else
              echo "::warning::Nama Pages 'agrotik' tidak dapat dibuat; mencoba nama cadangan unik."
              printf '%s\n' "$CREATE_PRIMARY"
              npx --yes wrangler@4 pages project create agrotik-irvan1609 --production-branch=master
              PROJECT="agrotik-irvan1609"
            fi
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "url=https://$PROJECT.pages.dev" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages project: $PROJECT"

      - name: Deploy dist to Cloudflare Pages
        if: steps.pages-project.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.pages-project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PROJECT" \
            --branch=master \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Agrotik production deploy"

      - name: Publish deployment summary
        if: always()
        env:
          PAGES_AVAILABLE: ${{ steps.pages-project.outputs.available }}
          PAGES_URL: ${{ steps.pages-project.outputs.url }}
        run: |
          echo "### Agrotik Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${PAGES_AVAILABLE:-false}" = "true" ]; then
            echo "Production URL: $PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployment tertunda: Cloudflare API token memerlukan Pages Write." >> "$GITHUB_STEP_SUMMARY"
          fi
