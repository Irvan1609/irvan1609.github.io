name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "stat/**"
      - "mendeley/**"
      - "print-skripsi/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "scripts/public-build.mjs"
      - "scripts/check-ui-contract.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify security contracts
        run: npm run test:security
      - name: Verify application
        run: npm run verify
      - name: Verify Werewolf files in Pages artifact
        run: |
          test -s dist/werewolf/index.html
          test -s dist/werewolf/app.js
          test -s dist/werewolf/style.css
          test -s dist/werewolf/subweb-header.css
          test -s dist/werewolf/assets/illustrations/hero-night.svg
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify Werewolf page is publicly served
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          URL="${PAGE_URL%/}/werewolf/"
          for attempt in {1..10}; do
            PAGE="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$URL" || true)"
            if printf '%s' "$PAGE" | grep -q 'THE VILLAGE'; then
              echo "Werewolf page is live: $URL"
              exit 0
            fi
            sleep 6
          done
          echo "::error::GitHub Pages deployment completed, but $URL did not serve the Werewolf page."
          exit 1

# Deployment source: master via GitHub Actions / GitHub Pages.
