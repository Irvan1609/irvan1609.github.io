name: Check Werewolf narrator voice

on:
  pull_request:
    branches: [master]
    paths:
      - "cloudflare/hitung-cabai-worker/**"
      - "cloudflare/werewolf-worker/**"
      - "public/werewolf/**"
      - "public/sw.js"
      - "scripts/check-account-auth.mjs"
      - "scripts/check-werewolf.mjs"
      - "scripts/check-werewolf-worker.mjs"
      - ".github/workflows/check-werewolf-narrator.yml"
  push:
    branches: [feature/werewolf-developer-narrator-voice]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check cloudflare/hitung-cabai-worker/src/index.js
          node --check cloudflare/werewolf-worker/src/index.js
          node --check public/werewolf/app.js
      - name: Run account and game regression checks
        run: |
          node scripts/check-account-auth.mjs
          node scripts/check-werewolf.mjs
          node scripts/check-werewolf-worker.mjs
