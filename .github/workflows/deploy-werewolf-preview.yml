name: Deploy Werewolf Preview

on:
  push:
    branches: [development]
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "scripts/public-build.mjs"
      - ".github/workflows/deploy-werewolf-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: werewolf-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify application and build production assets
        run: npm run verify

      - name: Resolve Cloudflare Pages project
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx --yes wrangler@4 pages project list --json)"
          if printf '%s' "$LIST" | jq -e '.[] | select(.name=="agrotik")' >/dev/null 2>&1; then
            PROJECT="agrotik"
          elif printf '%s' "$LIST" | jq -e '.[] | select(.name=="agrotik-irvan1609")' >/dev/null 2>&1; then
            PROJECT="agrotik-irvan1609"
          else
            set +e
            CREATE="$(npx --yes wrangler@4 pages project create agrotik --production-branch=master 2>&1)"
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ]; then
              printf '%s\n' "$CREATE"
              PROJECT="agrotik"
            else
              echo "::warning::Project 'agrotik' tidak tersedia; mencoba nama cadangan."
              printf '%s\n' "$CREATE"
              npx --yes wrangler@4 pages project create agrotik-irvan1609 --production-branch=master
              PROJECT="agrotik-irvan1609"
            fi
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "url=https://development.$PROJECT.pages.dev/werewolf/" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages preview project: $PROJECT"

      - name: Deploy development preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.pages.outputs.project }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PROJECT" \
            --branch=development \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Werewolf illustrated preview"

      - name: Verify preview page and artwork
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            PAGE="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$PREVIEW_URL" || true)"
            ART="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${PREVIEW_URL}assets/illustrations/hero-night.svg" || true)"
            if printf '%s' "$PAGE" | grep -q 'THE VILLAGE' && printf '%s' "$ART" | grep -q '<svg'; then
              echo "Preview ready: $PREVIEW_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preview belum merespons dengan halaman Werewolf dan aset ilustrasi."
          exit 1

      - name: Publish preview URL
        if: always()
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.url }}
          PROJECT: ${{ steps.pages.outputs.project }}
        run: |
          {
            echo "### Werewolf — Development Preview"
            echo ""
            if [ -n "${PREVIEW_URL:-}" ]; then
              echo "Preview URL: $PREVIEW_URL"
              echo ""
              echo "Branch: development"
              echo "Pages project: ${PROJECT:-not resolved}"
            else
              echo "Preview deployment did not produce a URL. Check the preceding step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
