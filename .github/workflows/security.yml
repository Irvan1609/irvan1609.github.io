name: Security Guard

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify application
        run: npm run verify

      - name: Cross-account isolation smoke test
        env:
          CHILI_API_URL: ${{ vars.CHILI_API_URL }}
          AUTHZ_TEST_USER_A_TOKEN: ${{ secrets.AUTHZ_TEST_USER_A_TOKEN }}
          AUTHZ_TEST_USER_B_TOKEN: ${{ secrets.AUTHZ_TEST_USER_B_TOKEN }}
        run: node scripts/smoke-account-isolation.mjs
