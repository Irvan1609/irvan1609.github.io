name: Security Guard

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify security contracts
        run: npm run test:security

      - name: Cross-account isolation smoke test
        env:
          CHILI_API_URL: ${{ vars.CHILI_API_URL }}
          AUTHZ_TEST_USER_A_TOKEN: ${{ secrets.AUTHZ_TEST_USER_A_TOKEN }}
          AUTHZ_TEST_USER_B_TOKEN: ${{ secrets.AUTHZ_TEST_USER_B_TOKEN }}
        run: node scripts/smoke-account-isolation.mjs
