name: Werewolf Regression Checks

on:
  pull_request:
    paths:
      - "cloudflare/werewolf-worker/**"
      - "public/werewolf/**"
      - "scripts/check-werewolf.mjs"
      - "scripts/check-werewolf-worker.mjs"
      - ".github/workflows/werewolf-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check public/werewolf/app.js
          node --check cloudflare/werewolf-worker/src/index.js

      - name: Run Werewolf UI and Worker regression suites
        run: |
          node scripts/check-werewolf.mjs
          node scripts/check-werewolf-worker.mjs
