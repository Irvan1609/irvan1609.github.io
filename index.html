<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Statistical Tool</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--line:#d5d9df;--text:#20242a;--muted:#69717d;--accent:#2563a6;--accent-soft:#e8f0f9;--bottom:64px}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.top{background:var(--surface);border-bottom:1px solid var(--line);z-index:10}.brand{height:44px;display:flex;align-items:center;padding:0 14px;font-weight:650}.brand small{font-weight:400;color:var(--muted);margin-left:8px}.desktop-nav{display:flex;overflow-x:auto;border-top:1px solid #eef0f3}.desktop-nav button{border:0;background:transparent;padding:9px 14px;white-space:nowrap;color:#303640}.desktop-nav button:hover{background:var(--accent-soft)}.toolbar{display:flex;gap:7px;padding:6px 10px;border-top:1px solid #eef0f3;overflow-x:auto}.tool{min-height:38px;border:1px solid #bfc5cd;background:#fff;border-radius:5px;padding:5px 11px;white-space:nowrap}.tool.primary{background:var(--accent);border-color:var(--accent);color:#fff}.layout{min-height:0;flex:1;display:flex}.sidebar{width:240px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.side-title{padding:10px 12px;background:#f0f2f4;border-bottom:1px solid var(--line);font-weight:600}.tree{padding:8px;overflow:auto}.tree button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:5px}.tree button.active,.tree button:hover{background:var(--accent-soft)}.workspace{min-width:0;flex:1;display:flex;flex-direction:column;background:#fff}.workspace-head{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);background:#f8f9fa;min-height:48px}.workspace-head input{width:180px;max-width:42vw;border:1px solid #bcc3cc;border-radius:4px;padding:6px 8px}.count{font-size:12px;color:var(--muted)}.grid-wrap{min-height:0;flex:1;overflow:auto}.grid{border-collapse:collapse;min-width:100%;table-layout:auto}.grid th,.grid td{border:1px solid #d4d8dd;height:36px;padding:7px 10px;white-space:nowrap}.grid th{position:sticky;top:0;background:#eef0f2;font-weight:600;z-index:3}.grid th:first-child,.grid td:first-child{position:sticky;left:0;background:#f4f5f6;z-index:4;width:45px;text-align:center;color:#69717d}.grid td[contenteditable]{background:#fff;outline:none}.grid td[contenteditable]:focus{box-shadow:inset 0 0 0 2px #5b91c7}.status{height:28px;padding:5px 10px;background:#f0f1f3;border-top:1px solid var(--line);font-size:12px;color:#5f6874}.mobile-bottom{display:none}.drawer-overlay{display:none}.paste-panel{position:fixed;inset:0;background:#0006;z-index:50;align-items:flex-end;justify-content:center;padding:0}.dialog{background:#fff;width:min(760px,100%);max-height:92dvh;border-radius:12px 12px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px #0003}.dialog h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:17px}.dialog-body{padding:15px;overflow:auto}.dialog textarea{width:100%;min-height:210px;border:1px solid #adb5bf;border-radius:6px;padding:10px;font-family:monospace;resize:vertical}.preview{margin-top:12px;overflow:auto;max-height:250px}.preview table{border-collapse:collapse}.preview td{border:1px solid #d1d5da;padding:5px 8px;white-space:nowrap}.actions{display:flex;gap:8px;justify-content:flex-end;padding:11px 15px;border-top:1px solid var(--line)}.actions button{min-height:42px;padding:7px 16px;border:1px solid #adb4bd;border-radius:6px;background:#f2f3f5}.actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}.mobile-menu{display:none;border:0;background:transparent;font-size:22px;margin-right:8px}
@media(max-width:900px){.sidebar{width:210px}.desktop-nav button{padding:9px 12px}}
@media(max-width:700px){:root{--bottom:64px}.brand{height:48px}.mobile-menu{display:inline-block}.desktop-nav{display:none}.toolbar{padding:6px 10px}.toolbar .tool{min-height:42px}.layout{padding-bottom:var(--bottom)}.sidebar{position:fixed;top:48px;bottom:var(--bottom);left:-250px;width:245px;z-index:40;transition:left .2s;box-shadow:4px 0 18px #0003}.sidebar.open{left:0}.drawer-overlay.show{display:block;position:fixed;inset:48px 0 var(--bottom);background:#0004;z-index:30}.workspace-head{min-height:50px;padding:7px 10px}.workspace-head input{width:145px}.status{display:none}.mobile-bottom{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);height:var(--bottom);bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:45;padding-bottom:env(safe-area-inset-bottom)}.mobile-bottom button{border:0;background:#fff;color:#58616c;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.mobile-bottom button.active{color:var(--accent);font-weight:600}.grid th,.grid td{height:42px;padding:8px 11px}.paste-panel{align-items:flex-end}.dialog{max-height:94dvh}.actions{padding-bottom:calc(11px + env(safe-area-inset-bottom))}}
@media(min-width:701px){.paste-panel{align-items:center;padding:15px}.dialog{border:1px solid #888;border-radius:7px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><button id="menuBtn" class="mobile-menu">☰</button>Statistical Tool <small>Data Editor</small></div><nav class="desktop-nav"><button>Project</button><button class="active">Data</button><button>Design</button><button>Analyze</button><button>Graphs</button><button>Help</button></nav><div class="toolbar"><button class="tool primary" id="pasteBtn">📋 Paste Data</button><button class="tool" id="importBtn">📁 Import CSV</button><button class="tool" id="addRow">＋ Row</button><button class="tool" id="delRow">− Row</button><button class="tool" id="addCol">＋ Column</button><button class="tool" id="delCol">− Column</button></div></header>
<div id="overlay" class="drawer-overlay"></div>
<main class="layout"><aside id="sidebar" class="sidebar"><div class="side-title">Project Explorer</div><div class="tree"><button class="active">📁 Data</button><button>　📄 Dataset</button><button>📁 Output</button></div></aside><section class="workspace"><div class="workspace-head"><strong>Data Editor</strong><input id="datasetName" value="dataset" aria-label="Nama dataset"><span id="info" class="count">0 × 0</span></div><div id="gridWrap" class="grid-wrap"></div><div id="status" class="status">Siap. Paste data dari Excel atau masukkan data secara manual.</div></section></main>
<nav class="mobile-bottom"><button class="active" id="dataNav">▦<span>Data</span></button><button id="analyzeNav">ƒ(x)<span>Analyze</span></button><button id="outputNav">▤<span>Output</span></button><button id="moreNav">☰<span>More</span></button></nav>
</div>
<input id="file" type="file" accept=".csv,text/csv" hidden>
<div id="pastePanel" class="paste-panel" style="display:none"><div class="dialog"><h3>Paste Data</h3><div class="dialog-body"><p style="margin-top:0">Salin blok data dari Excel, lalu tempelkan di sini.</p><textarea id="pasteArea" placeholder="Tempel data Excel di sini..."></textarea><label style="display:block;margin-top:10px"><input id="hasHeader" type="checkbox" checked> Baris pertama adalah nama variabel</label><div id="preview" class="preview"></div></div><div class="actions"><button id="cancelPaste">Batal</button><button id="applyPaste" class="primary">Masukkan Data</button></div></div></div>
<script>
let data=[],headers=[];const $=id=>document.getElementById(id);function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function parse(t){return t.replace(/\r/g,'').split('\n').filter(x=>x.length).map(x=>x.split('\t'))}function render(){let h='<table class="grid"><thead><tr><th>#</th>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';data.forEach((r,i)=>{h+='<tr><td>'+(i+1)+'</td>'+headers.map((_,j)=>'<td contenteditable="true" data-r="'+i+'" data-c="'+j+'">'+esc(r[j]??'')+'</td>').join('')+'</tr>'});h+='</tbody></table>';$('gridWrap').innerHTML=h;$('info').textContent=data.length+' × '+headers.length;$('gridWrap').querySelectorAll('[contenteditable]').forEach(td=>td.addEventListener('input',()=>data[+td.dataset.r][+td.dataset.c]=td.textContent))}function preview(){let a=parse($('pasteArea').value);if(!a.length){$('preview').innerHTML='';return}let header=$('hasHeader').checked,hs=header?a[0]:a[0].map((_,i)=>'Variable'+(i+1)),rows=a.slice(header?1:0);$('preview').innerHTML='<b>Preview: '+rows.length+' baris × '+hs.length+' kolom</b><table>'+[hs,...rows.slice(0,8)].map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>'}function openPaste(){$('pastePanel').style.display='flex';$('pasteArea').focus();preview()}$('pasteBtn').onclick=openPaste;$('cancelPaste').onclick=()=>$('pastePanel').style.display='none';$('pasteArea').oninput=preview;$('hasHeader').onchange=preview;$('applyPaste').onclick=()=>{let a=parse($('pasteArea').value);if(!a.length)return;let header=$('hasHeader').checked;headers=header?a[0]:a[0].map((_,i)=>'Variable'+(i+1));data=a.slice(header?1:0).map(r=>headers.map((_,i)=>r[i]??''));render();$('pastePanel').style.display='none';$('status').textContent='✓ '+data.length+' baris berhasil dimasukkan.'};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let a=parse(await f.text());if(a.length){headers=a[0];data=a.slice(1).map(r=>headers.map((_,i)=>r[i]??''));render();$('status').textContent='✓ CSV berhasil diimpor.'}};$('addRow').onclick=()=>{if(!headers.length)headers=['Variable1'];data.push(headers.map(()=>''));render()};$('delRow').onclick=()=>{data.pop();render()};$('addCol').onclick=()=>{headers.push('Variable'+(headers.length+1));data.forEach(r=>r.push(''));render()};$('delCol').onclick=()=>{if(headers.length){headers.pop();data.forEach(r=>r.pop());render()}};function toggleDrawer(){ $('sidebar').classList.toggle('open');$('overlay').classList.toggle('show')}$('menuBtn').onclick=toggleDrawer;$('moreNav').onclick=toggleDrawer;$('overlay').onclick=toggleDrawer;$('analyzeNav').onclick=()=>alert('Modul Analyze akan menggunakan dataset aktif.');$('outputNav').onclick=()=>alert('Output akan ditampilkan di workspace.');document.addEventListener('paste',e=>{if(document.activeElement.tagName==='TEXTAREA'||document.activeElement.isContentEditable)return;let t=e.clipboardData?.getData('text/plain');if(t&&t.includes('\t')){e.preventDefault();$('pasteArea').value=t;openPaste()}});render();
</script>
</body></html>
