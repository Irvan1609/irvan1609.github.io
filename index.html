<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Statistical Data Editor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:#222;background:#f3f3f3}button,input{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.top{background:#fff;border-bottom:1px solid #bbb}.title{height:42px;display:flex;align-items:center;padding:0 14px;font-weight:600}.menus{display:flex;overflow-x:auto;border-top:1px solid #eee}.menus button{border:0;background:#fff;padding:9px 14px;white-space:nowrap;cursor:pointer}.menus button:hover{background:#e9eef5}.toolbar{display:flex;gap:6px;padding:6px 10px;border-top:1px solid #ddd;overflow-x:auto;background:#f7f7f7}.toolbar button{min-height:38px;border:1px solid #aaa;background:#fff;border-radius:4px;padding:5px 12px;white-space:nowrap}.body{min-height:0;flex:1;display:flex}.sidebar{width:240px;background:#fff;border-right:1px solid #aaa;display:flex;flex-direction:column}.side-title{padding:9px 10px;background:#e8e8e8;border-bottom:1px solid #bbb;font-weight:600}.tree{padding:8px;overflow:auto}.tree button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px;border-radius:3px}.tree button:hover,.tree button.active{background:#dbe8f7}.workspace{min-width:0;flex:1;display:flex;flex-direction:column;background:#fff}.sheet-head{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #aaa;background:#eee}.sheet-head input{width:190px;border:1px solid #aaa;padding:5px 7px}.grid-wrap{min-height:0;flex:1;overflow:auto}.grid{border-collapse:collapse;min-width:100%;table-layout:auto}.grid th,.grid td{border:1px solid #c5c5c5;padding:6px 9px;height:34px;white-space:nowrap}.grid th{position:sticky;top:0;background:#e9e9e9;z-index:2}.grid th:first-child,.grid td:first-child{position:sticky;left:0;background:#f1f1f1;z-index:3;text-align:center;width:48px}.grid td[contenteditable="true"]{background:#fff}.status{height:28px;border-top:1px solid #aaa;background:#eee;padding:5px 9px;font-size:12px}.paste-panel{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;padding:15px}.dialog{background:#fff;width:min(760px,100%);max-height:90dvh;border:1px solid #777;border-radius:5px;display:flex;flex-direction:column;box-shadow:0 8px 30px #0004}.dialog h3{margin:0;padding:12px 15px;border-bottom:1px solid #ccc;font-size:16px}.dialog-body{padding:15px;overflow:auto}.dialog textarea{width:100%;min-height:240px;resize:vertical;border:1px solid #aaa;padding:9px;font-family:monospace}.preview{margin-top:12px;overflow:auto;max-height:250px}.preview table{border-collapse:collapse}.preview td{border:1px solid #ccc;padding:5px 8px;white-space:nowrap}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:10px 15px;border-top:1px solid #ccc}.dialog-actions button{min-height:40px;padding:7px 16px;border:1px solid #999;border-radius:4px;background:#eee}.dialog-actions .primary{background:#2868a8;color:#fff;border-color:#2868a8}.mobile-menu{display:none}
@media(max-width:700px){.sidebar{position:fixed;z-index:20;top:42px;bottom:0;left:-260px;transition:left .2s;box-shadow:4px 0 15px #0003}.sidebar.open{left:0}.mobile-menu{display:inline-block}.title{height:42px}.menus button{padding:8px 12px}.sheet-head input{width:130px}.grid th,.grid td{padding:7px 9px}.toolbar button{min-height:42px}.dialog{max-height:94dvh}.dialog-body{padding:12px}.paste-panel{padding:8px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="title"><button id="menuBtn" class="mobile-menu" style="border:0;background:none;font-size:22px;margin-right:8px">☰</button>Statistical Data Editor</div><nav class="menus"><button>Project</button><button>Data</button><button>Design</button><button>Analyze</button><button>Graphs</button><button>Help</button></nav><div class="toolbar"><button id="pasteBtn">📋 Paste from Excel</button><button id="importBtn">📁 Import CSV</button><button id="addRow">＋ Row</button><button id="delRow">− Row</button><button id="addCol">＋ Column</button><button id="delCol">− Column</button></div></header>
<main class="body"><aside id="sidebar" class="sidebar"><div class="side-title">Project Explorer</div><div class="tree"><button class="active">📁 Data</button><button id="dataset">　📄 Dataset</button><button>📁 Output</button></div></aside><section class="workspace"><div class="sheet-head"><strong>Data Editor</strong><input id="datasetName" value="dataset" aria-label="Nama dataset"><span id="info">0 × 0</span></div><div id="gridWrap" class="grid-wrap"></div><div class="status" id="status">Siap — Anda dapat menempelkan blok data langsung dari Excel.</div></section></main>
</div>
<input id="file" type="file" accept=".csv,text/csv" hidden>
<div id="pastePanel" class="paste-panel"><div class="dialog"><h3>Paste Data dari Excel</h3><div class="dialog-body"><p style="margin-top:0">Salin blok data dari Excel, lalu tempelkan di area berikut. Tab menjadi kolom dan baris baru menjadi baris.</p><textarea id="pasteArea" placeholder="Tempel data Excel di sini..."></textarea><label style="display:block;margin-top:10px"><input id="hasHeader" type="checkbox" checked> Baris pertama adalah nama variabel</label><div id="preview" class="preview"></div></div><div class="dialog-actions"><button id="cancelPaste">Batal</button><button id="applyPaste" class="primary">Masukkan Data</button></div></div></div>
<script>
let data=[];let headers=[];const $=id=>document.getElementById(id);function render(){let h='<table class="grid"><thead><tr><th>#</th>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';data.forEach((r,i)=>{h+='<tr><td>'+(i+1)+'</td>'+headers.map((_,j)=>'<td contenteditable="true" data-r="'+i+'" data-c="'+j+'">'+esc(r[j]??'')+'</td>').join('')+'</tr>'});h+='</tbody></table>';$('gridWrap').innerHTML=h;$('info').textContent=data.length+' × '+headers.length;$('gridWrap').querySelectorAll('td[contenteditable]').forEach(td=>td.addEventListener('input',()=>{data[+td.dataset.r][+td.dataset.c]=td.textContent}))}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function parse(text){return text.replace(/\r/g,'').split('\n').filter(x=>x.length).map(x=>x.split('\t'))}function preview(){const a=parse($('pasteArea').value);if(!a.length){$('preview').innerHTML='';return}let start=$('hasHeader').checked?1:0;let hs=$('hasHeader').checked?a[0]:a[0].map((_,i)=>'Variable'+(i+1));let rows=a.slice(start);$('preview').innerHTML='<b>Preview: '+rows.length+' baris × '+hs.length+' kolom</b><table>'+[hs,...rows.slice(0,8)].map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>'}function openPaste(){$('pastePanel').style.display='flex';$('pasteArea').focus();preview()}$('pasteBtn').onclick=openPaste;$('cancelPaste').onclick=()=>{$('pastePanel').style.display='none'};$('pasteArea').addEventListener('input',preview);$('hasHeader').onchange=preview;$('applyPaste').onclick=()=>{const a=parse($('pasteArea').value);if(!a.length)return;headers=$('hasHeader').checked?a[0]:a[0].map((_,i)=>'Variable'+(i+1));const start=$('hasHeader').checked?1:0;data=a.slice(start).map(r=>headers.map((_,i)=>r[i]??''));render();$('pastePanel').style.display='none';$('status').textContent='✓ '+data.length+' baris berhasil dimasukkan dari Excel.'};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();const a=parse(t);if(a.length){headers=a[0];data=a.slice(1).map(r=>headers.map((_,i)=>r[i]??''));render();$('status').textContent='✓ CSV berhasil diimpor: '+data.length+' baris.'}};$('addRow').onclick=()=>{if(!headers.length)headers=['Variable1'];data.push(headers.map(()=>''));render()};$('delRow').onclick=()=>{if(data.length)data.pop();render()};$('addCol').onclick=()=>{headers.push('Variable'+(headers.length+1));data.forEach(r=>r.push(''));render()};$('delCol').onclick=()=>{if(headers.length){headers.pop();data.forEach(r=>r.pop());render()}};$('menuBtn').onclick=()=> $('sidebar').classList.toggle('open');document.addEventListener('paste',e=>{if(document.activeElement.tagName==='TEXTAREA'||document.activeElement.isContentEditable)return;const t=e.clipboardData?.getData('text/plain');if(t&&t.includes('\t')){e.preventDefault();$('pasteArea').value=t;openPaste()}});render();
</script>
</body></html>
